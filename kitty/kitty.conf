
# Shell
shell /usr/bin/zsh --login
startup_session $HOME/dotfiles/kitty/sessions/startup.kitty-session
map ctrl+cmd+1 goto_session $HOME/.config/kitty/sessions/coding.kitty-session
map ctrl+cmd+2 goto_session $HOME/.config/kitty/sessions/dotfiles.kitty-session
map ctrl+cmd+q close_session . 

tab_bar_filter session:~ or session:^$

# Apariencia general
font_family JetBrains Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14

background_opacity 0.9
dynamic_background_opacity yes
window_padding_width 0
hide_window_decorations yes

# Cursor
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Desplazamiento
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Comportamiento
enable_audio_bell no
confirm_os_window_close 0
selection_foreground #c0caf5
selection_background #33467c

# Noctalia Default
foreground #cdd6f4
background #11111b

# Colores normales
color0  #181825
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #89dceb
color7  #bac2de

# Colores brillantes
color8  #45475a
color9  #eba0ac
color10 #94e2d5
color11 #fab387
color12 #74c7ec
color13 #f5c2e7
color14 #b4befe
color15 #cdd6f4
